server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A request body is a query or a decision of a few hundred characters
    client_max_body_size 16k;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # nginx is the edge: overwrite rather than append, so a client cannot forge its address
        # for the backend's rate limit
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # Progress arrives as server-sent events: pass each frame on as it is produced
        proxy_buffering off;
        proxy_cache off;

        # A shopping query takes up to ~2 minutes; the LLM and search calls inside it have their own timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
